name: JBFMS CRM checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax and tests
        run: npm run check
